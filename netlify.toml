[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  # Astro corre en el puerto 4321
  targetPort = 4321
  # Netlify Dev expone todo (sitio + lambdas) en el puerto 8888
  port       = 8888
  functions  = "netlify/functions"

# --- Migración de dominio: almundotours.com -> tripanytravel.com ---
# Sin estas reglas el dominio viejo sirve el sitio con 200 y Google lo ve
# como contenido duplicado, sin transferir autoridad al dominio nuevo.
# force = true es necesario porque de lo contrario Netlify resuelve la ruta
# real antes de aplicar el redirect. Las reglas de netlify.toml se evalúan
# antes que el _redirects que genera el adapter de Astro.

[[redirects]]
  from   = "https://almundotours.com/*"
  to     = "https://www.tripanytravel.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.almundotours.com/*"
  to     = "https://www.tripanytravel.com/:splat"
  status = 301
  force  = true

# --- Slugs de destinos normalizados a minúsculas sin espacios ---
# Los ids traían mayúsculas, espacios y hasta un "\t" de YAML que salía
# como %09 en la URL. Se corrigieron en src/content/destinations; estos
# 301 conservan lo que Google ya tenga indexado de las rutas viejas.

[[redirects]]
  from   = "/destinos/internacionales/EUROPA"
  to     = "/destinos/internacionales/europa"
  status = 301

[[redirects]]
  from   = "/destinos/internacionales/Madrid%20y%20Par%C3%ADs"
  to     = "/destinos/internacionales/madrid-y-paris"
  status = 301

[[redirects]]
  from   = "/destinos/internacionales/Argentina"
  to     = "/destinos/internacionales/argentina"
  status = 301

[[redirects]]
  from   = "/destinos/internacionales/Guatemala"
  to     = "/destinos/internacionales/guatemala"
  status = 301

[[redirects]]
  from   = "/destinos/nacionales/Santa%20Marta"
  to     = "/destinos/nacionales/santa-marta-premium-tayrona"
  status = 301

[[forms]]
  name = "cotizacion"

[[forms]]
  name = "contacto"
